name: Build and Push to ACR

on:
  workflow_dispatch:  # Isse tum manually GitHub se trigger kar sakte ho

permissions:
  id-token: write
  contents: read
  
jobs:
  build-and-push:
    runs-on: self-hosted

    env:
      IMAGE_NAME: todo-ui
      IMAGE_TAG: v4
      ACR_NAME: blibacr4829
      ACR_LOGIN_SERVER: blibacr4829.azurecr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: Azure/login@v2.3.0
        with:
          client-id: 29b5b410-5e74-4b95-a9e4-1d155855e944
          tenant-id: c77566ed-d418-4a73-9140-4db6f3d115e6
          subscription-id: c0748677-9808-4356-8816-dc8088c5bb59

      - name: Log in to ACR
        run: |
          az acr login --name $env:ACR_NAME
      
      - name: Build Docker Image
        run: |
          docker build -t "$env:IMAGE_NAME:$env:IMAGE_TAG" .
      
      - name: Tag Docker Image for ACR
        run: |
          docker tag "$env:IMAGE_NAME:$env:IMAGE_TAG" "$env:ACR_LOGIN_SERVER/$env:IMAGE_NAME:$env:IMAGE_TAG"
      
      - name: Push Docker Image to ACR
        run: |
          docker push "$env:ACR_LOGIN_SERVER/$env:IMAGE_NAME:$env:IMAGE_TAG"
